services:
  - type: web
    name: lineargridtransformer-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: API_CORS_ORIGINS
        fromService:
          type: web
          name: lineargridtransformer-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: lineargridtransformer-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --global pnpm@10.34.3 && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: lineargridtransformer-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
